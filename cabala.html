<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" email="ing.jonathanf@gmail.com" content="Web Software Development" value="Developer Jonathan Fiquitiva">

    <title>Aplicacion Kabala | Oráculo Numérico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/cabala.css">

</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-md w-full p-8 text-center transition-all duration-500">
        <h1 class="text-3xl font-light mb-2 tracking-widest glow-text titulo-mistico">MÍSTICA</h1>
        <p class="text-sm text-gray-400 mb-8 uppercase tracking-tighter">Calculadora de Vibración Numérica</p>

        <div class="space-y-6">
            <div class="text-left">
                <label class="block text-xs mb-2 ml-1 text-fecha">FECHA DE NACIMIENTO</label>
                <input type="date" id="birthdate" 
                    class="w-full bg-transparent border-b border-gray-700 py-2 px-1 input-mistico outline-none transition-colors text-white cursor-pointer">
            </div>

            <button onclick="calculateKabala()" 
                class="btn-mystic">
                Revelar Destino
            </button>
        </div>

        <div id="result-container" class="mt-12 hidden opacity-0 transition-opacity duration-1000">
            <div class="flex justify-center mb-4">
                <div id="kabala-number" class="result-circle w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold text-black italic">
                    --
                </div>
            </div>
            <h2 id="kabala-title" class="text-xl font-semibold text-yellow-500 mb-2"></h2>
            <p id="kabala-desc" class="text-gray-400 text-sm leading-relaxed"></p>
        </div>
    </div>
    
    <script src="js/cabala.js"></script> 

</body>
</html>
