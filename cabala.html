<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo Numérico | Cábala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #070708 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 20px;
        }
        .glow-text {
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        .result-circle {
            background: linear-gradient(135deg, #d4af37 0%, #f9e27d 100%);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-md w-full p-8 text-center transition-all duration-500 hover:border-yellow-600/30">
        <h1 class="text-3xl font-light mb-2 tracking-widest glow-text text-yellow-500">MÍSTICA</h1>
        <p class="text-sm text-gray-400 mb-8 uppercase tracking-tighter">Calculadora de Vibración Numérica</p>

        <div class="space-y-6">
            <div class="text-left">
                <label class="block text-xs text-yellow-600 mb-2 ml-1">FECHA DE NACIMIENTO</label>
                <input type="date" id="birthdate" 
                    class="w-full bg-transparent border-b border-gray-700 py-2 px-1 focus:border-yellow-500 outline-none transition-colors text-white cursor-pointer">
            </div>

            <button onclick="calculateKabala()" 
                class="w-full bg-white/5 hover:bg-yellow-500 hover:text-black py-3 rounded-full border border-yellow-500/50 transition-all duration-300 font-bold tracking-widest uppercase text-sm">
                Revelar Destino
            </button>
        </div>

        <div id="result-container" class="mt-12 hidden opacity-0 transition-opacity duration-1000">
            <div class="flex justify-center mb-4">
                <div id="kabala-number" class="result-circle w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold text-black italic">
                    --
                </div>
            </div>
            <h2 id="kabala-title" class="text-xl font-semibold text-yellow-500 mb-2"></h2>
            <p id="kabala-desc" class="text-gray-400 text-sm leading-relaxed"></p>
        </div>
    </div>
    
    <script src="js/cabala.js"></script> <!-- Bootstrap local -->

</body>
</html>
